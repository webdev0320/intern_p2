name: Deploy to VPS

on:
  push:
    branches:
      - main

# This section tells GitHub to use Node 24 for all actions in this file
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to your project folder
            cd /home/iyouwork.com/public_html
            
            # Force pull to ensure local changes don't block the update
            git fetch origin main
            git reset --hard origin/main
            
            # Clean install and build
            # Note: Ensure Node.js is also updated on your VPS to match
            npm install
            npm run build
            
            # Restart the web server
            sudo /usr/local/lsws/bin/lswsctrl restart