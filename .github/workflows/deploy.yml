name: Deploy to VPS

on:
  push:
    branches:
      - main  # Trigger on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/iyouwork.com/public_html
            git pull origin main
            npm install
            npm run build
            # If using Nginx, ensure it points to /home/iyouwork.com/public_html
            sudo systemctl restart nginx